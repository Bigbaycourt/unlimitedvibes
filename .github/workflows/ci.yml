name: CI - Run Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          pytest -m unit \
            --cov=app \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --junitxml=results-unit.xml \
            -v

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-unit
          path: results-unit.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: test-key-ci
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: test
        run: |
          pytest -m integration \
            --cov=app \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junitxml=results-integration.xml \
            --timeout=120 \
            -v

      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-integration
          path: results-integration.xml

  all-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run full test suite with coverage
        env:
          ANTHROPIC_API_KEY: test-key-ci
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: test
        run: |
          pytest \
            --cov=app \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage-full.xml \
            --cov-report=term-missing \
            --junitxml=results-full.xml \
            -v

      - name: Upload full coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Upload full coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full-xml
          path: coverage-full.xml

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=70
