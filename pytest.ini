[pytest]
# AsyncIO Configuration
asyncio_mode = auto

# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    compliance: Compliance & moderation tests
    equity: Equity & cap table tests
    costs: Cost optimization tests
    integration: Integration tests (require DB)
    slow: Slow tests (network calls, batch API)
    unit: Unit tests (fast)

# Coverage
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -v

# Test paths
testpaths = tests

# Timeout (60s for most tests, 300s for integration)
timeout = 60

# asyncio-friendly
asyncio_default_fixture_scope = function
